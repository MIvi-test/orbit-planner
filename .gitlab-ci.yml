# CI PI-Planner. Описание гейта и правил — IMPLEMENTATION_PLAN.md §2.3.
#
# Джобы со статусом «пока не блокирует» помечены `allow_failure: true` и
# комментарием, КОГДА это снимается (волна плана). Снимать флаг — отдельным
# коммитом в той же волне, не откладывая.

stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # Сервис PostgreSQL: тот же мажор, что в docker-compose.yaml.
  POSTGRES_DB: pi_planner
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST_AUTH_METHOD: trust
  # Коммит, от которого считаются «старые» базы при проверке миграций:
  # вершина develop на момент приёма аудита (d5cde74).
  MIGRATION_BASE_REF: d5cde74

cache:
  key: "py-$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/uv
    - .cache/pip

.python:
  image: python:3.14-slim
  before_script:
    - pip install --quiet "uv>=0.12"
    - uv sync --frozen --group dev

.postgres:
  services:
    - name: postgres:17-bookworm
      alias: postgres
  variables:
    PI_PLANNER_DSN: "host=postgres port=5432 dbname=pi_planner user=postgres password=postgres"
    TEST_DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/pi_planner"

# --- Юнит-тесты (без базы): PostgreSQL-тесты здесь пропускаются ------------
unit:
  extends: .python
  stage: test
  script:
    - uv run pytest -q -rs

# --- Те же тесты с PostgreSQL: ни один тест не должен быть пропущен --------
pg:
  extends: [.python, .postgres]
  stage: test
  script:
    - uv run python tools/apply_sql.py --wait 60
    - |
      rc=0
      uv run pytest -q -rs -p no:cacheprovider > pytest.log 2>&1 || rc=$?
      cat pytest.log
      if grep -q "нужен PostgreSQL" pytest.log; then
        echo "ОШИБКА: PostgreSQL-тесты пропущены, TEST_DATABASE_URL не сработал" >&2
        exit 1
      fi
      exit $rc
  artifacts:
    when: always
    paths: [pytest.log]
    expire_in: 1 week

# --- Цикл: датасет -> базовый план -> факт спринта 1, 0 ошибок приёмки -----
cycle:
  extends: [.python, .postgres]
  stage: test
  script:
    - uv run python tools/apply_sql.py --wait 60
    - >
      uv run python tools/apply_sql.py
      db/01_schema.sql db/02_contract.sql build/seed.sql
      db/03_substitutions.sql db/04_views.sql db/05_invariants.sql
    - uv run python tools/ci_cycle_check.py --sprints 1

# --- Полный цикл на 3 спринта. Сейчас НЕ блокирует: после факта спринта 1 план
# пустеет (ETC_REQUIRED у всех задач в работе, B-6), демо-сценарий не доходит
# до спринта 2. Снять allow_failure в волне 1 после решения B-6.
cycle-full:
  extends: [.python, .postgres]
  stage: test
  allow_failure: true
  script:
    - uv run python tools/apply_sql.py --wait 60
    - >
      uv run python tools/apply_sql.py
      db/01_schema.sql db/02_contract.sql build/seed.sql
      db/03_substitutions.sql db/04_views.sql db/05_invariants.sql
    - uv run python tools/ci_cycle_check.py --sprints 3

# --- Чистая установка и обновление дают одну и ту же схему -----------------
# Сейчас НЕ блокирует: до волны 1 (B-1) базовая схема не штампует версии в
# schema_migrations, и `migrate` на свежей базе падает. Снять allow_failure
# в волне 1 вместе с исправлением B-1.
schema-equivalence:
  extends: [.python, .postgres]
  stage: test
  allow_failure: true
  variables:
    GIT_DEPTH: "0"
  script:
    - uv run python tools/apply_sql.py --wait 60
    - |
      uv run python - <<'PY'
      import os, psycopg
      with psycopg.connect(os.environ["PI_PLANNER_DSN"], autocommit=True) as c:
          for name in ("fresh", "upgraded"):
              c.execute(f"DROP DATABASE IF EXISTS {name}")
              c.execute(f"CREATE DATABASE {name}")
      PY
    - export BASE="host=postgres port=5432 user=postgres password=postgres"
    # 1. Чистая установка из текущего дерева, затем migrate — обязан быть no-op.
    - export PI_PLANNER_DSN="$BASE dbname=fresh"
    - >
      uv run python tools/apply_sql.py
      db/01_schema.sql db/02_contract.sql build/seed.sql
      db/03_substitutions.sql db/04_views.sql db/05_invariants.sql
    - uv run python tools/migrate.py
    - uv run python tools/schema_fingerprint.py > fresh.txt
    # 2. Старая база: базовые файлы MIGRATION_BASE_REF, затем все миграции.
    - mkdir -p /tmp/base && git archive "$MIGRATION_BASE_REF" db build | tar -x -C /tmp/base
    - export PI_PLANNER_DSN="$BASE dbname=upgraded"
    - >
      uv run python tools/apply_sql.py
      /tmp/base/db/01_schema.sql /tmp/base/db/02_contract.sql /tmp/base/build/seed.sql
      /tmp/base/db/03_substitutions.sql /tmp/base/db/04_views.sql /tmp/base/db/05_invariants.sql
    - uv run python tools/migrate.py
    - uv run python tools/schema_fingerprint.py > upgraded.txt
    - diff -u fresh.txt upgraded.txt
  artifacts:
    when: always
    paths: [fresh.txt, upgraded.txt]
    expire_in: 1 week

# --- Фронт: сборка и свежесть закоммиченного web/dist ----------------------
# Сейчас НЕ блокирует: web/dist отстаёт от web/src (B-2). Снять allow_failure
# в волне 1 после пересборки dist.
web:
  image: node:22-bookworm-slim
  stage: test
  allow_failure: true
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git >/dev/null
    - cd web
    - npm ci --no-audit --no-fund
  script:
    - npm run build
    - cd ..
    - git diff --exit-code -- web/dist || { echo "web/dist устарел: выполните npm run build и закоммитьте" >&2; exit 1; }
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths: [web/node_modules/.cache]

# --- Стиль: ruff. Не блокирует, пока в коде есть старые замечания ----------
lint:
  image: python:3.14-slim
  stage: test
  allow_failure: true
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check --output-format=concise app etl tools tests
